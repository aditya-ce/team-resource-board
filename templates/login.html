{% extends "base.html" %}

{% block title %}Sign In | Team Resource Board{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-2xl shadow-slate-200/50">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-3xl shadow-xl shadow-blue-500/30 mx-auto mb-6">
                TR
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Welcome Back</h1>
            <p class="text-slate-500">Sign in to access your team's resources.</p>
        </div>

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Email Address</label>
                <input type="email" id="email" name="email" required 
                    class="w-full px-4 py-4 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all placeholder:text-slate-400"
                    placeholder="name@company.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Password</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-4 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all placeholder:text-slate-400"
                    placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-blue-500/30 hover:bg-blue-700 hover:-translate-y-0.5 transition-all">
                Sign In
            </button>
        </form>

        <div class="mt-10 pt-8 border-t border-slate-100 text-center">
            <p class="text-slate-500 mb-4 text-sm font-medium italic">"Cloud-native collaboration made simple."</p>
            <div class="flex justify-center space-x-4 grayscale opacity-50">
                <!-- Platform logos as subtle indicators -->
                <span class="text-xs font-bold px-2 py-1 bg-slate-100 rounded">SUPABASE</span>
                <span class="text-xs font-bold px-2 py-1 bg-slate-100 rounded">RENDER</span>
                <span class="text-xs font-bold px-2 py-1 bg-slate-100 rounded">ORACLE</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
